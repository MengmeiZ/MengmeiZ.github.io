<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="张梦玫 Mengmei Zhang — 大模型与图智能方向研究者；中国电信数据发展中心（支付）博士后研究员，CCF A 类顶会顶刊 12 篇。">
<meta name="color-scheme" content="light dark">
<title>张梦玫 Mengmei Zhang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@600&family=Noto+Sans+SC:wght@400;500&display=swap">
</head>
<body>
<style>
:root{
  --bg:#FAFBFA; --surface:#FFFFFF;
  --ink:#161F1E; --ink-2:#4B5755; --ink-3:#7E8987;
  --line:#E1E7E5; --line-strong:#CBD5D2;
  --accent:#0F6E6A; --accent-soft:#E6F1EF; --on-accent:#FFFFFF;
  --flag:#9C5B0A; --flag-soft:#F7EEE0;
  --shadow:0 1px 2px rgba(22,31,30,.05);
  --f-display:"Newsreader","Noto Serif SC",Georgia,"Songti SC",serif;
  --f-body:"IBM Plex Sans","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root:lang(zh){ --f-display:"Noto Serif SC","Newsreader",Georgia,serif; }

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1413; --surface:#161D1C;
    --ink:#E9EEEC; --ink-2:#A8B3B0; --ink-3:#798481;
    --line:#253130; --line-strong:#33403E;
    --accent:#4CB6AD; --accent-soft:#152F2C; --on-accent:#0F1413;
    --flag:#D9A45E; --flag-soft:#2A2114;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1413; --surface:#161D1C;
  --ink:#E9EEEC; --ink-2:#A8B3B0; --ink-3:#798481;
  --line:#253130; --line-strong:#33403E;
  --accent:#4CB6AD; --accent-soft:#152F2C; --on-accent:#0F1413;
  --flag:#D9A45E; --flag-soft:#2A2114;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:15.5px; line-height:1.68;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

.page{
  max-width:1080px;margin:0 auto;padding-inline:24px;padding-block:56px 72px;
  display:grid;grid-template-columns:280px 1fr;gap:64px;align-items:start;
}

/* ---------- rail ---------- */
.rail{position:sticky;top:40px;display:flex;flex-direction:column;gap:20px}
.avatar{width:168px;height:168px;border-radius:4px;object-fit:cover;border:1px solid var(--line);background:var(--accent-soft)}
.avatar-fb{
  width:168px;height:168px;border-radius:4px;border:1px solid var(--line);background:var(--accent-soft);
  display:grid;place-items:center;font-family:var(--f-display);font-size:46px;color:var(--accent);
}
.name{font-family:var(--f-display);font-weight:600;font-size:31px;line-height:1.15;margin:0;letter-spacing:-.01em}
.name-alt{font-family:var(--f-body);font-weight:500;font-size:16px;color:var(--ink-2);margin:6px 0 0}
.affil{margin:0;color:var(--ink-2);font-size:14px;line-height:1.6}
.affil strong{color:var(--ink);font-weight:500}

.contact{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.contact li{display:flex;gap:10px;align-items:baseline}
.contact .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);min-width:66px}
.contact a{color:var(--accent);word-break:break-all}
.contact span.v{color:var(--ink-2)}

.rail-tools{display:flex;gap:8px;padding-top:4px;border-top:1px solid var(--line)}
.btn{
  font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);
  border-radius:3px;padding:6px 11px;cursor:pointer;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* ---------- sections ---------- */
main{display:flex;flex-direction:column;gap:52px;min-width:0}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:20px}
.sec-head::before{content:"";width:26px;height:2px;background:var(--accent);flex:none;transform:translateY(-6px)}
.sec-head h2{font-family:var(--f-display);font-weight:600;font-size:23px;margin:0;text-wrap:balance}
.sec-head .en-sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}

.prose{max-width:64ch;color:var(--ink-2)}
.prose p{margin:0 0 14px}
.prose p:last-child{margin-bottom:0}
.prose strong{color:var(--ink);font-weight:500}

/* stat strip */
.stats{
  display:flex;flex-wrap:wrap;gap:0 0;margin-bottom:22px;
  border:1px solid var(--line);border-radius:5px;background:var(--surface);overflow:hidden;
}
.stat{flex:1 1 150px;padding:13px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat b{
  display:block;font-family:var(--f-mono);font-size:21px;font-weight:500;color:var(--accent);
  font-variant-numeric:tabular-nums;line-height:1.25;
}
.stat span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.stat-note{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin:-14px 0 20px}

/* interests */
.interests{display:flex;flex-direction:column;max-width:68ch}
.interest{display:grid;grid-template-columns:minmax(0,16em) 1fr;gap:8px 24px;padding:14px 0;border-top:1px solid var(--line)}
.interest:last-child{border-bottom:1px solid var(--line)}
.interest-key{display:flex;flex-direction:column;gap:4px;min-width:0}
.interest-group{font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.interest h3{margin:0;font-size:15px;font-weight:600;color:var(--ink);line-height:1.5}
.interest p{margin:0;color:var(--ink-2);font-size:14.5px}

/* news */
.news{display:flex;flex-direction:column;max-width:70ch}
.news-row{display:grid;grid-template-columns:6.5em 1fr;gap:6px 22px;padding:11px 0;border-top:1px solid var(--line)}
.news-row:last-child{border-bottom:1px solid var(--line)}
.news-date{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:2px}
.news-body{color:var(--ink-2);font-size:14.5px}
.news-body strong{color:var(--ink);font-weight:500}

/* publications */
.subhead{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:34px 0 14px;padding-bottom:7px;border-bottom:1px solid var(--line);
}
.subhead:first-of-type{margin-top:0}
.pubs{display:flex;flex-direction:column;gap:16px}
.pub{
  display:grid;grid-template-columns:126px 1fr;gap:22px;
  background:var(--surface);border:1px solid var(--line);border-radius:5px;
  padding:17px 20px;box-shadow:var(--shadow);
}
.venue{border-right:1px solid var(--line);padding-right:18px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.venue-name{font-family:var(--f-display);font-size:25px;font-weight:600;line-height:1.05;color:var(--accent)}
.venue-year{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.venue-rank{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.09em;font-weight:500;
  background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:3px;margin-top:4px;
}
.venue-rank.q1{background:var(--flag-soft);color:var(--flag)}
.pub-body{min-width:0}
.pub-title{font-family:var(--f-display);font-size:18px;font-weight:600;margin:0 0 7px;line-height:1.35;text-wrap:balance}
.authors{margin:0 0 8px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.authors .me{color:var(--ink);font-weight:600;border-bottom:1.5px solid var(--accent)}
.authors .suffix{display:block;color:var(--ink-3);font-size:12.5px;margin-top:3px}
.note{margin:0 0 10px;font-size:13.5px;color:var(--ink-2);padding-left:11px;border-left:2px solid var(--flag)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;padding:3.5px 9px;border-radius:3px;border:1px solid var(--line-strong);color:var(--ink-2)}
a.chip:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
.chip-role{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.chip-role2{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.chip-flag{background:var(--flag-soft);border-color:transparent;color:var(--flag)}
.chip-cite{border-style:dashed;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* compact list for minor works */
.minor{display:flex;flex-direction:column;max-width:74ch}
.minor-row{display:grid;grid-template-columns:11em 1fr;gap:4px 20px;padding:12px 0;border-top:1px solid var(--line)}
.minor-row:last-child{border-bottom:1px solid var(--line)}
.minor-venue{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);line-height:1.5;padding-top:2px}
.minor-venue b{display:block;color:var(--ink-2);font-weight:500}
.minor-what h3{margin:0 0 3px;font-size:14.5px;font-weight:600;line-height:1.45}
.minor-what p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.55}
.minor-what .me{color:var(--ink);font-weight:600;border-bottom:1.5px solid var(--accent)}
.minor-role{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;color:var(--accent);
  background:var(--accent-soft);padding:1px 6px;border-radius:3px;margin-left:6px;white-space:nowrap;
}

/* rows: service / talks / honors / experience */
.rows{display:flex;flex-direction:column;max-width:72ch}
.row{display:grid;grid-template-columns:9.5em 1fr;gap:6px 22px;padding:13px 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row-when{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:2px}
.row-what h3{margin:0 0 2px;font-size:15px;font-weight:600;line-height:1.5}
.row-what p{margin:0;color:var(--ink-2);font-size:14px}

/* placeholders */
.todo-inline,.prose em,.news-body em,.row-what em{
  font-style:normal;font-family:var(--f-mono);font-size:11.5px;
  color:var(--flag);background:var(--flag-soft);padding:1px 6px;border-radius:3px;
}
.todo{border:1px dashed var(--line-strong);border-radius:4px;padding:11px 14px;color:var(--ink-3);font-size:13.5px}
.todo::before{
  content:attr(data-tag);display:block;font-family:var(--f-mono);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--flag);margin-bottom:3px;
}

footer.site{
  border-top:1px solid var(--line);padding-top:18px;
  font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink-3);
  display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;
}

@media (max-width:820px){
  .page{grid-template-columns:1fr;gap:44px;padding-block:40px 56px}
  .rail{position:static}
  .avatar,.avatar-fb{width:120px;height:120px}
  .avatar-fb{font-size:34px}
  main{gap:44px}
  .pub{grid-template-columns:1fr;gap:14px}
  .venue{border-right:none;border-bottom:1px solid var(--line);padding-right:0;padding-bottom:12px;flex-direction:row;align-items:baseline;gap:9px;flex-wrap:wrap}
  .venue-rank{margin-top:0}
  .stat{flex:1 1 46%;border-bottom:1px solid var(--line)}
  .interest,.news-row,.row,.minor-row{grid-template-columns:1fr;gap:3px}
  .news-date,.row-when,.minor-venue{padding-top:0}
  .minor-venue b{display:inline}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="page">
  <aside class="rail">
    <img class="avatar" src="avatar.jpg" alt="" id="avatar">
    <div>
      <h1 class="name" id="f-name"></h1>
      <p class="name-alt" id="f-name-alt"></p>
    </div>
    <p class="affil" id="f-affil"></p>
    <ul class="contact" id="f-contact"></ul>
    <div class="rail-tools">
      <button class="btn" id="lang-btn" type="button"></button>
      <button class="btn" id="theme-btn" type="button" aria-pressed="false"></button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<!-- 所有文字内容都在 data.js 里，改内容只改那个文件 -->
<script src="data.js"></script>

<script>
/* ------------------------------------------------------------------
   渲染层 / RENDER LAYER — 一般不需要改动
   ------------------------------------------------------------------ */
const L = () => document.documentElement.lang === "en" ? "en" : "zh";
const p = v => (v == null) ? "" : (typeof v === "string" ? v : (v[L()] ?? ""));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const names = arr => arr.map(a => a === T.me ? `<span class="me">${esc(a)}</span>` : esc(a)).join(", ");

function head(key){
  const s = T.sections[key];
  if (!s) return "";
  return `<div class="sec-head"><h2>${esc(p(s))}</h2><span class="en-sub">${esc(s.sub || "")}</span></div>`;
}

/* 整节容错：data.js 里某一节被注释掉或删掉时，这一节直接不显示，
   而不是整个页面白屏。所以你可以放心地注释掉任何一节。 */
function sec(key, body){
  if (!body) return "";
  return `<section id="${key}">${head(key)}${body}</section>`;
}
const has = list => Array.isArray(list) && list.length > 0;
function rows(list){
  if (!has(list)) return "";
  return `<div class="rows">${list.map(r => `
    <div class="row">
      <div class="row-when">${esc(p(r.w))}</div>
      <div class="row-what"><h3>${esc(p(r.t))}</h3>${r.s ? `<p>${p(r.s)}</p>` : ""}</div>
    </div>`).join("")}</div>`;
}

function pubCard(b){
  return `<article class="pub">
    <div class="venue">
      <span class="venue-name">${esc(b.v)}</span>
      <span class="venue-year">${esc(b.y)}</span>
      ${b.rank ? `<span class="venue-rank">${esc(b.rank)}</span>` : ""}
    </div>
    <div class="pub-body">
      <h3 class="pub-title">${esc(b.t)}</h3>
      <p class="authors">${names(b.a)}${b.s ? `<span class="suffix">${esc(p(b.s))}</span>` : ""}</p>
      ${b.note ? `<p class="note">${esc(p(b.note))}</p>` : ""}
      <div class="chips">
        ${b.role ? `<span class="chip ${b.role === "sole" ? "chip-role" : "chip-role2"}">${esc(p(T.roles[b.role]))}</span>` : ""}
        ${b.flag ? `<span class="chip chip-flag">${esc(p(b.flag))}</span>` : ""}
        ${b.l.map(k => `<a class="chip" href="${esc(k.h)}" target="_blank" rel="noopener">${esc(p(k.l))}</a>`).join("")}
        ${cites(b.t)}
      </div>
    </div>
  </article>`;
}

const normTitle = t => String(t).toLowerCase().replace(/[^a-z0-9]/g, "");
function cites(title){
  const sc = window.SCHOLAR;
  if (!sc || !sc.papers) return "";
  const n = sc.papers[normTitle(title)];
  if (!n) return "";
  return `<span class="chip chip-cite">${esc(p(T.citedLabel)).replace("{n}", n)}</span>`;
}

function render(){
  document.getElementById("f-name").textContent = p(T.name);
  document.getElementById("f-name-alt").textContent = p(T.nameAlt);
  document.getElementById("f-affil").innerHTML = p(T.affil);
  document.getElementById("lang-btn").textContent = p(T.langBtn);
  document.getElementById("theme-btn").textContent = p(T.themeBtn);

  document.getElementById("f-contact").innerHTML = T.contact.map(c => {
    const val = esc(p(c.v));
    return `<li><span class="k">${esc(p(c.k))}</span>${
      c.href ? `<a href="${esc(c.href)}">${val}</a>` : `<span class="v">${val}</span>`
    }</li>`;
  }).join("");

  const out = [];

  out.push(sec("about", has(T.about && T.about[L()])
    ? `<div class="prose">${T.about[L()].map(x => `<p>${x}</p>`).join("")}</div>` : ""));

  out.push(sec("interests", !has(T.interests) ? "" : `<div class="interests">${
    T.interests.map((i, n) => {
      const newGroup = n === 0 || T.interests[n - 1].g !== i.g;
      return `<div class="interest">
        <div class="interest-key">
          ${newGroup ? `<span class="interest-group">${esc(p(T.interestGroups[i.g]))}</span>` : ""}
          <h3>${esc(p(i.t))}</h3>
        </div>
        <p>${p(i.d)}</p>
      </div>`;
    }).join("")
  }</div>`));

  out.push(sec("news", !has(T.news) ? "" : `<div class="news">${
    T.news.map(n => `<div class="news-row"><div class="news-date">${esc(n.d)}</div><div class="news-body">${p(n.t)}</div></div>`).join("")
  }</div>`));

  /* PREPRINTS —— 在投/预印本已隐藏。要重新显示：
     1) 在 data.js 里取消 preprintsHead / preprints 那段的注释；
     2) 删掉下面这个注释块的首尾符号，并把这段粘回 pubs 的模板字符串末尾
        （放在 minor 列表那个 </div> 后面、结束的 </section> 前面）：

    <p class="subhead">${esc(p(T.preprintsHead))}</p>
    <div class="minor">${T.preprints.map(m => `
      <div class="minor-row">
        <div class="minor-venue"><b>arXiv</b>${esc(m.y)}</div>
        <div class="minor-what"><h3>${esc(m.t)}</h3></div>
      </div>`).join("")}</div>
  */
  out.push(sec("pubs", !has(T.pubs) && !has(T.minor) ? "" : `
    <div class="stats">${(T.stats || []).map(s => {
      const sc = window.SCHOLAR;
      const n = (s.id === "citations" && sc && sc.citedby) ? String(sc.citedby) : s.n;
      let lab = p(s.l);
      if (s.id === "citations" && sc && sc.hindex) lab = lab.replace(/h-index\s*\d+/, "h-index " + sc.hindex);
      return `<div class="stat"><b>${esc(n)}</b><span>${esc(lab)}</span></div>`;
    }).join("")}</div>
    <p class="stat-note">${esc(window.SCHOLAR && window.SCHOLAR.updated
      ? p(T.statNoteAuto).replace("{date}", window.SCHOLAR.updated)
      : p(T.statNote))}</p>
    ${!has(T.pubs) ? "" : `<p class="subhead">${esc(p(T.pubHeads.a))}</p>
    <div class="pubs">${T.pubs.map(pubCard).join("")}</div>`}
    ${!has(T.minor) ? "" : `<p class="subhead">${esc(p(T.pubHeads.b))}</p>
    <div class="minor">${T.minor.map(m => `
      <div class="minor-row">
        <div class="minor-venue"><b>${esc(p(m.v))}</b>${esc(m.y)}${m.rank ? ` · ${esc(m.rank)}` : ""}</div>
        <div class="minor-what">
          <h3>${esc(m.t)}${m.role ? `<span class="minor-role">${esc(p(T.roles[m.role]))}</span>` : ""}</h3>
          <p>${names(m.a)}${m.s ? ` — ${esc(p(m.s))}` : ""}</p>
        </div>
      </div>`).join("")}</div>`}
  `));

  out.push(sec("service", rows(T.service)));
  out.push(sec("talks", rows(T.talks)));
  out.push(sec("exp", rows(T.exp)));
  out.push(`<footer class="site">${((T.footer && T.footer[L()]) || []).map(f => `<span>${esc(f)}</span>`).join("")}</footer>`);

  document.getElementById("main").innerHTML = out.join("");
}

/* avatar fallback — 把 avatar.jpg 放到同目录即可替换 */
(function(){
  const img = document.getElementById("avatar");
  const fb = () => {
    if (!img.isConnected) return;
    const d = document.createElement("div");
    d.className = "avatar-fb";
    d.textContent = "MZ";
    img.replaceWith(d);
  };
  img.addEventListener("error", fb);
  if (img.complete && img.naturalWidth === 0) fb();
})();

function setLang(l){
  document.documentElement.lang = l;
  try { localStorage.setItem("hp-lang", l); } catch (e) {}
  render();
}
document.getElementById("lang-btn").addEventListener("click", () => setLang(L() === "zh" ? "en" : "zh"));

const themeBtn = document.getElementById("theme-btn");
function setTheme(t){
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  themeBtn.setAttribute("aria-pressed", t === "dark" ? "true" : "false");
  try { t ? localStorage.setItem("hp-theme", t) : localStorage.removeItem("hp-theme"); } catch (e) {}
}
themeBtn.addEventListener("click", () => {
  setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? null : "dark");
});

(function(){
  let l = "zh", t = null;
  try { l = localStorage.getItem("hp-lang") || "zh"; t = localStorage.getItem("hp-theme"); } catch (e) {}
  document.documentElement.lang = l;
  if (t) setTheme(t);
  render();

  /* 引用数由 GitHub Action 每周写入 scholar.json。
     本地用 file:// 打开时 fetch 会失败，此时保留 data.js 里写死的数字。 */
  fetch("scholar.json", {cache: "no-store"})
    .then(r => r.ok ? r.json() : null)
    .then(d => { if (d && d.citedby) { window.SCHOLAR = d; render(); } })
    .catch(() => {});
})();
</script>
</body>
</html>
